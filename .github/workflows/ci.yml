name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Danelix.sln

      - name: Build
        run: dotnet build Danelix.sln --no-restore --configuration Release

      - name: Verify formatting
        run: dotnet format Danelix.sln --verify-no-changes --no-restore

      - name: Tests
        run: dotnet test Danelix.sln --no-build --configuration Release
